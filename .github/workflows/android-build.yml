name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - android-capacitor
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check web production build
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Comma-separated list; the action splits package names on commas.
          packages: "platform-tools, platforms;android-35, build-tools;35.0.0"

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build installable debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: dercibs-doces-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
